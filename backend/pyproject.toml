[project]
name = "trace-backend"
version = "0.1.0"
description = "FastAPI backend for TRACE - Solana Onchain Detective Game"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "cryptography>=44.0.0",
    "base58>=2.1.1",
    "pyjwt>=2.10.0",
    "bcrypt>=4.2.0",
    "httpx>=0.28.0",
    "email-validator>=2.2.0",
    "redis>=5.0.0",
    "sqlmodel>=0.0.48",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.32.0",
    "greenlet>=3.5.6",
    "starlette-admin>=1.0.2",
    "google-auth>=2.61.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "fakeredis>=2.20.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

